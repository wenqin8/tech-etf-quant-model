[project]
name = "etf-quant-lab"
version = "0.1.0"
description = "A local, auditable A-share ETF quantitative research and paper-trading assistant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "akshare>=1.14,<2",
  "apscheduler>=3.10,<4",
  "duckdb>=1,<2",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "polars>=1,<2",
  "pyarrow>=20,<22",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "streamlit>=1.45,<2",
  "structlog>=25,<26",
  "tushare>=1.4,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.2,<3",
  "pyarrow-stubs>=20.0.0.20260625",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_quant_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["etf_quant_lab"]

[tool.coverage.run]
branch = true
source = ["etf_quant_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

